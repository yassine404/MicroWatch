server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --- Redirections internes pour les appels sans /api (corrige le bug) ---
    location /alerts {
        rewrite ^/alerts(.*)$ /api/alerts$1 break;
        proxy_pass http://sla-service:8098;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /microservices {
        rewrite ^/microservices(.*)$ /api/microservices$1 break;
        proxy_pass http://metrics-service:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logs {
        rewrite ^/logs(.*)$ /api/logs$1 break;
        proxy_pass http://metrics-service:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        rewrite ^/metrics(.*)$ /api/metrics$1 break;
        proxy_pass http://metrics-service:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sla {
        rewrite ^/sla(.*)$ /api/sla$1 break;
        proxy_pass http://sla-service:8098;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- User Service ---
    location /api/auth { proxy_pass http://user-service:8089; }
    location /api/users { proxy_pass http://user-service:8089; }
    location /api/admin { proxy_pass http://user-service:8089; }

    # --- Metrics Service ---
    location /api/metrics { proxy_pass http://metrics-service:8088; }
    location /api/logs { proxy_pass http://metrics-service:8088; }
    location /api/microservices { proxy_pass http://metrics-service:8088; }

    # --- SLA Service ---
    location /api/sla { proxy_pass http://sla-service:8098; }
    location /api/alerts { proxy_pass http://sla-service:8098; }

    # --- IA Service ---
    location /api/ia { proxy_pass http://ia_service:8000; }

    # Fallback SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}